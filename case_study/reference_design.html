document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

 — portfolio project<\u002Fdiv>\n    <h1 style=\"font-family:'Archivo',sans-serif; font-weight:900; font-size:clamp(64px,10vw,140px); line-height:0.92; letter-spacing:-0.03em; margin:0 0 28px;\">Terroir<\u002Fh1>\n    <p style=\"font-family:'Archivo',sans-serif; font-weight:500; font-size:clamp(22px,2.6vw,32px); line-height:1.35; max-width:820px; margin:0 0 36px; color:#33302A;\">A land-suitability analysis for Bay of Plenty kiwifruit horticulture, built entirely on real New Zealand government geospatial data.<\u002Fp>\n    <p style=\"font-size:17px; color:#4A443C; max-width:640px; margin:0 0 44px;\">By Gabriela Olivera — sister project to <a href=\"https://apophenia-nz.vercel.app\" target=\"_blank\" rel=\"noopener\">Apophenia<\u002Fa>, a kiwifruit export risk simulator.<\u002Fp>\n    <div style=\"display:flex; flex-wrap:wrap; gap:14px;\">\n      <a href=\"#\" target=\"_blank\" rel=\"noopener\" style=\"font-family:'Archivo',sans-serif; font-weight:700; font-size:15px; background:#915117; color:#F4F1EA; padding:14px 26px; border-radius:2px; text-decoration:none;\">View live dashboard<\u002Fa>\n      <a href=\"#\" target=\"_blank\" rel=\"noopener\" style=\"font-family:'Archivo',sans-serif; font-weight:700; font-size:15px; background:transparent; color:#201C17; border:1.5px solid #201C17; padding:12.5px 26px; border-radius:2px; text-decoration:none;\">GitHub repo<\u002Fa>\n      <a href=\"https://apophenia-nz.vercel.app\" target=\"_blank\" rel=\"noopener\" style=\"font-family:'Archivo',sans-serif; font-weight:700; font-size:15px; background:transparent; color:#201C17; border:1.5px solid #201C17; padding:12.5px 26px; border-radius:2px; text-decoration:none;\">Apophenia →<\u002Fa>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- DIFFERENTIATOR -->\n  <div style=\"max-width:1240px; margin:0 auto; padding:64px 32px 80px; border-top:1px solid #C9C6BD;\">\n    <div style=\"display:grid; grid-template-columns: 1.1fr 1fr; gap:64px; align-items:start;\">\n      <h2 style=\"font-family:'Archivo',sans-serif; font-weight:800; font-size:clamp(32px,3.6vw,48px); line-height:1.1; letter-spacing:-0.02em; margin:0; text-wrap:pretty;\">Most portfolio projects run on synthetic data. This one doesn't.<\u002Fh2>\n      <div>\n        <p style=\"font-size:18px; color:#33302A; margin:0 0 20px;\">Terroir is built on real official sources: cadastral parcels from LINZ, soil properties from S-map/LRIS, land cover from LCDB, and climate records from Open-Meteo. That means real data-quality problems along the way — found, diagnosed, and fixed in the open, visible in the commit history rather than smoothed over.<\u002Fp>\n        <p style=\"font-size:18px; color:#33302A; margin:0;\">The section below covers five of those problems in plain language.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:flex; gap:56px; flex-wrap:wrap; margin-top:56px;\">\n      <div>\n        <div style=\"font-family:'Archivo',sans-serif; font-weight:900; font-size:52px; color:#915117; letter-spacing:-0.02em;\">22,834<\u002Fdiv>\n        <div style=\"font-size:15px; color:#4A443C; margin-top:4px;\">parcels ingested<\u002Fdiv>\n      <\u002Fdiv>\n      <div>\n        <div style=\"font-family:'Archivo',sans-serif; font-weight:900; font-size:52px; color:#915117; letter-spacing:-0.02em;\">21,491<\u002Fdiv>\n        <div style=\"font-size:15px; color:#4A443C; margin-top:4px;\">parcels scored<\u002Fdiv>\n      <\u002Fdiv>\n      <div>\n        <div style=\"font-family:'Archivo',sans-serif; font-weight:900; font-size:52px; color:#915117; letter-spacing:-0.02em;\">4<\u002Fdiv>\n        <div style=\"font-size:15px; color:#4A443C; margin-top:4px;\">territorial authorities<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- FINDINGS -->\n  <div id=\"findings\" style=\"background:#201C17; color:#E8E8E3; padding:88px 32px;\">\n    <div style=\"max-width:1240px; margin:0 auto;\">\n      <div style=\"font-family:'Archivo',sans-serif; font-weight:700; font-size:15px; letter-spacing:0.08em; text-transform:uppercase; color:#D9A66B; margin-bottom:16px;\">What we found along the way<\u002Fdiv>\n      <h2 style=\"font-family:'Archivo',sans-serif; font-weight:800; font-size:clamp(32px,3.4vw,44px); line-height:1.15; letter-spacing:-0.02em; margin:0 0 48px; max-width:760px; text-wrap:pretty;\">Real government data comes with real problems. Here's what broke, and how each one was caught.<\u002Fh2>\n\n      <div style=\"display:flex; flex-direction:column; gap:1px; background:#3A352C;\">\n\n        <div style=\"background:#201C17; padding:32px 0; display:grid; grid-template-columns:64px 1fr; gap:24px;\">\n          <div style=\"font-family:'Archivo',sans-serif; font-weight:900; font-size:32px; color:#5C564A;\">01<\u002Fdiv>\n          <div>\n            <h3 style=\"font-family:'Archivo',sans-serif; font-weight:700; font-size:22px; margin:0 0 10px;\">A coordinate system that lied about itself<\u002Fh3>\n            <p style=\"font-size:16.5px; color:#C7C3BA; margin:0; max-width:760px;\">A geospatial source was labelled WGS84, a common global coordinate system — but it was actually NZGD2000, New Zealand's local standard. The mislabel went unnoticed until it broke a later spatial join, shifting parcels out of place. Fixed by verifying every new source's CRS against its own metadata rather than assuming the label was correct.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"background:#201C17; padding:32px 0; display:grid; grid-template-columns:64px 1fr; gap:24px;\">\n          <div style=\"font-family:'Archivo',sans-serif; font-weight:900; font-size:32px; color:#5C564A;\">02<\u002Fdiv>\n          <div>\n            <h3 style=\"font-family:'Archivo',sans-serif; font-weight:700; font-size:22px; margin:0 0 10px;\">A join key that wasn't actually unique<\u002Fh3>\n            <p style=\"font-size:16.5px; color:#C7C3BA; margin:0; max-width:760px;\">LINZ's parcel_id looks like a natural primary key, but cross-leases and unit titles share it across multiple legal records on the same physical land. Merging on it silently let one parcel's data overwrite another's, with no error raised. Traced to a more reliable field and re-verified as genuinely unique before reusing it.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"background:#2A2117; padding:32px 0; display:grid; grid-template-columns:64px 1fr; gap:24px; border-left:4px solid #F2A900;\">\n          <div style=\"font-family:'Archivo',sans-serif; font-weight:900; font-size:32px; color:#F2A900; padding-left:20px;\">03<\u002Fdiv>\n          <div>\n            <div style=\"display:inline-block; font-family:'Archivo',sans-serif; font-weight:700; font-size:12px; letter-spacing:0.06em; text-transform:uppercase; color:#201C17; background:#F2A900; padding:4px 10px; border-radius:2px; margin-bottom:12px;\">Most significant<\u002Fdiv>\n            <h3 style=\"font-family:'Archivo',sans-serif; font-weight:700; font-size:22px; margin:0 0 10px;\">A macron silently deleted a whole district<\u002Fh3>\n            <p style=\"font-size:16.5px; color:#DCD7CB; margin:0; max-width:760px;\">Ōpōtiki — like many NZ place names — carries a macron. The plain-ASCII text filter used to select territorial authorities didn't match it. No error, no warning: Ōpōtiki District was simply absent from the analysis from day one. It went undetected until a later scope audit compared the filtered list against the full set of source districts and found the gap.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"background:#201C17; padding:32px 0; display:grid; grid-template-columns:64px 1fr; gap:24px;\">\n          <div style=\"font-family:'Archivo',sans-serif; font-weight:900; font-size:32px; color:#5C564A;\">04<\u002Fdiv>\n          <div>\n            <h3 style=\"font-family:'Archivo',sans-serif; font-weight:700; font-size:22px; margin:0 0 10px;\">An off-by-one that misfiled 19% of parcels<\u002Fh3>\n            <p style=\"font-size:16.5px; color:#C7C3BA; margin:0; max-width:760px;\">The function that sorts parcels into Excellent/Good/Marginal tiers had a boundary error — a score sitting exactly on a tier edge landed one tier lower than it should have. It misclassified roughly 19% of scored parcels before being caught and corrected.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"background:#201C17; padding:32px 0; display:grid; grid-template-columns:64px 1fr; gap:24px;\">\n          <div style=\"font-family:'Archivo',sans-serif; font-weight:900; font-size:32px; color:#5C564A;\">05<\u002Fdiv>\n          <div>\n            <h3 style=\"font-family:'Archivo',sans-serif; font-weight:700; font-size:22px; margin:0 0 10px;\">A geographic scope that missed a growing region<\u002Fh3>\n            <p style=\"font-size:16.5px; color:#C7C3BA; margin:0; max-width:760px;\">The initial scope covered three districts. Local knowledge flagged Whakatāne District as a genuine kiwifruit-growing area missing from that list, so it was added. Rather than assuming the remaining neighbouring districts had no orchard land, that was confirmed empirically using the land-cover dataset itself — the evidence, not an assumption, closed the question.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- METHODOLOGY -->\n  <div id=\"methodology\" style=\"max-width:1240px; margin:0 auto; padding:96px 32px;\">\n    <div style=\"display:grid; grid-template-columns:1.1fr 1fr; gap:64px; align-items:start;\">\n      <div>\n        <div style=\"font-family:'Archivo',sans-serif; font-weight:700; font-size:15px; letter-spacing:0.08em; text-transform:uppercase; color:#78420F; margin-bottom:16px;\">Methodology<\u002Fdiv>\n        <h2 style=\"font-family:'Archivo',sans-serif; font-weight:800; font-size:clamp(32px,3.4vw,44px); line-height:1.15; letter-spacing:-0.02em; margin:0 0 24px; text-wrap:pretty;\">Weighted by what actually varies, not by assumption<\u002Fh2>\n        <p style=\"font-size:17.5px; color:#33302A; margin:0 0 18px;\">Each parcel's suitability score combines four soil properties: soil order, soil texture, soil drainage, and soil depth. The weights — 40/40/10/10 — reflect which factors actually vary meaningfully across the region's real data, not which factors are assumed to matter most in theory. Point values are grounded in established NZ kiwifruit agronomic research.<\u002Fp>\n        <p style=\"font-size:17.5px; color:#33302A; margin:0 0 32px;\">Parcels are grouped into three suitability levels — Excellent, Good, Marginal — rather than forced into a fine-grained ranking, since a large share of parcels genuinely tie at the top score. That tie is itself a finding about the region's geology, not a modelling shortcut.<\u002Fp>\n        <a href=\"#\" target=\"_blank\" rel=\"noopener\" style=\"font-family:'Archivo',sans-serif; font-weight:700; font-size:15px;\">Full methodology on GitHub →<\u002Fa>\n      <\u002Fdiv>\n      <div style=\"background:#F4F1EA; border:1px solid #C9C6BD; padding:36px;\">\n        <div style=\"font-family:'Archivo',sans-serif; font-weight:700; font-size:14px; text-transform:uppercase; letter-spacing:0.06em; color:#4A443C; margin-bottom:20px;\">Score weighting<\u002Fdiv>\n        <div style=\"display:flex; height:52px; width:100%; overflow:hidden; border-radius:2px;\">\n          <div style=\"width:40%; background:#915117; display:flex; align-items:center; justify-content:center; color:#F4F1EA; font-family:'Archivo',sans-serif; font-weight:800; font-size:16px;\">40%<\u002Fdiv>\n          <div style=\"width:40%; background:#B98552; display:flex; align-items:center; justify-content:center; color:#201C17; font-family:'Archivo',sans-serif; font-weight:800; font-size:16px;\">40%<\u002Fdiv>\n          <div style=\"width:10%; background:#8A8478; display:flex; align-items:center; justify-content:center; color:#F4F1EA; font-family:'Archivo',sans-serif; font-weight:700; font-size:12px;\">10%<\u002Fdiv>\n          <div style=\"width:10%; background:#5C564A; display:flex; align-items:center; justify-content:center; color:#F4F1EA; font-family:'Archivo',sans-serif; font-weight:700; font-size:12px;\">10%<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:flex; margin-top:14px; font-size:13.5px; color:#4A443C;\">\n          <div style=\"width:40%;\">Soil order<\u002Fdiv>\n          <div style=\"width:40%;\">Soil texture<\u002Fdiv>\n          <div style=\"width:10%;\">Drainage<\u002Fdiv>\n          <div style=\"width:10%;\">Depth<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- RESULTS -->\n  <div id=\"results\" style=\"background:#DEDDD5; padding:96px 32px;\">\n    <div style=\"max-width:1240px; margin:0 auto;\">\n      <div style=\"font-family:'Archivo',sans-serif; font-weight:700; font-size:15px; letter-spacing:0.08em; text-transform:uppercase; color:#78420F; margin-bottom:16px;\">Key results<\u002Fdiv>\n      <h2 style=\"font-family:'Archivo',sans-serif; font-weight:800; font-size:clamp(32px,3.4vw,44px); line-height:1.15; letter-spacing:-0.02em; margin:0 0 56px; max-width:760px; text-wrap:pretty;\">The region's land is more suitable than expected — and unevenly so<\u002Fh2>\n\n      <!-- Suitability breakdown -->\n      <div style=\"display:grid; grid-template-columns:1fr 1fr; gap:64px; margin-bottom:88px; align-items:center;\">\n        <div>\n          <h3 style=\"font-family:'Archivo',sans-serif; font-weight:700; font-size:20px; margin:0 0 20px;\">Region-wide suitability breakdown<\u002Fh3>\n          <div style=\"display:flex; height:64px; width:100%; border-radius:2px; overflow:hidden; margin-bottom:16px;\">\n            <div style=\"width:76.4%; background:#915117; display:flex; align-items:center; padding-left:16px; color:#F4F1EA; font-family:'Archivo',sans-serif; font-weight:800; font-size:18px;\">76.4%<\u002Fdiv>\n            <div style=\"width:18.1%; background:#B98552; display:flex; align-items:center; justify-content:center; color:#201C17; font-family:'Archivo',sans-serif; font-weight:800; font-size:14px;\">18.1%<\u002Fdiv>\n            <div style=\"width:5.5%; background:#8A8478;\"><\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:flex; gap:24px; font-size:14.5px; color:#4A443C;\">\n            <div><span style=\"display:inline-block; width:10px; height:10px; background:#915117; margin-right:6px; border-radius:1px;\"><\u002Fspan>Excellent<\u002Fdiv>\n            <div><span style=\"display:inline-block; width:10px; height:10px; background:#B98552; margin-right:6px; border-radius:1px;\"><\u002Fspan>Good<\u002Fdiv>\n            <div><span style=\"display:inline-block; width:10px; height:10px; background:#8A8478; margin-right:6px; border-radius:1px;\"><\u002Fspan>Marginal (5.5%)<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <p style=\"font-size:17px; color:#33302A; margin:0;\">Of the 21,491 scored parcels, three in four land in the Excellent tier — a reflection of the Bay of Plenty's naturally favourable volcanic soils for kiwifruit, not a lenient scoring model.<\u002Fp>\n      <\u002Fdiv>\n\n      <!-- Subzone comparison -->\n      <div style=\"margin-bottom:88px;\">\n        <h3 style=\"font-family:'Archivo',sans-serif; font-weight:700; font-size:20px; margin:0 0 6px;\">Suitability by subzone<\u002Fh3>\n        <p style=\"font-size:14.5px; color:#5C564A; margin:0 0 28px;\">Illustrative distribution consistent with the scored dataset — exact per-subzone figures live in the dashboard.<\u002Fp>\n        <div style=\"display:flex; gap:28px; align-items:flex-end; height:240px; border-bottom:1.5px solid #201C17; padding-bottom:0;\">\n          <div style=\"display:flex; flex-direction:column; align-items:center; flex:1; height:100%; justify-content:flex-end;\">\n            <div style=\"width:100%; display:flex; flex-direction:column; height:88%;\">\n              <div style=\"height:8%; background:#8A8478;\"><\u002Fdiv>\n              <div style=\"height:14%; background:#B98552;\"><\u002Fdiv>\n              <div style=\"height:78%; background:#915117;\"><\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"font-size:13px; color:#4A443C; margin-top:10px; font-family:'Archivo',sans-serif; font-weight:700;\">Katikati<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:flex; flex-direction:column; align-items:center; flex:1; height:100%; justify-content:flex-end;\">\n            <div style=\"width:100%; display:flex; flex-direction:column; height:85%;\">\n              <div style=\"height:9%; background:#8A8478;\"><\u002Fdiv>\n              <div style=\"height:16%; background:#B98552;\"><\u002Fdiv>\n              <div style=\"height:75%; background:#915117;\"><\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"font-size:13px; color:#4A443C; margin-top:10px; font-family:'Archivo',sans-serif; font-weight:700;\">Tauranga<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:flex; flex-direction:column; align-items:center; flex:1; height:100%; justify-content:flex-end;\">\n            <div style=\"width:100%; display:flex; flex-direction:column; height:74%;\">\n              <div style=\"height:13%; background:#8A8478;\"><\u002Fdiv>\n              <div style=\"height:22%; background:#B98552;\"><\u002Fdiv>\n              <div style=\"height:65%; background:#915117;\"><\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"font-size:13px; color:#4A443C; margin-top:10px; font-family:'Archivo',sans-serif; font-weight:700; text-align:center;\">Western BOP<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:flex; flex-direction:column; align-items:center; flex:1; height:100%; justify-content:flex-end;\">\n            <div style=\"width:100%; display:flex; flex-direction:column; height:68%;\">\n              <div style=\"height:16%; background:#8A8478;\"><\u002Fdiv>\n              <div style=\"height:26%; background:#B98552;\"><\u002Fdiv>\n              <div style=\"height:58%; background:#915117;\"><\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"font-size:13px; color:#4A443C; margin-top:10px; font-family:'Archivo',sans-serif; font-weight:700;\">Whakatāne<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:flex; flex-direction:column; align-items:center; flex:1; height:100%; justify-content:flex-end;\">\n            <div style=\"width:100%; display:flex; flex-direction:column; height:52%;\">\n              <div style=\"height:24%; background:#8A8478;\"><\u002Fdiv>\n              <div style=\"height:32%; background:#B98552;\"><\u002Fdiv>\n              <div style=\"height:44%; background:#915117;\"><\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"font-size:13px; color:#4A443C; margin-top:10px; font-family:'Archivo',sans-serif; font-weight:700;\">Ōpōtiki<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <p style=\"font-size:16px; color:#33302A; margin:22px 0 0; max-width:760px;\">Katikati and Tauranga dominate the Excellent tier. Ōpōtiki scores lowest overall and shows the most mixed distribution across all three tiers.<\u002Fp>\n      <\u002Fdiv>\n\n      <!-- Expansion candidates -->\n      <div style=\"background:#201C17; color:#E8E8E3; padding:48px; margin-bottom:88px; display:grid; grid-template-columns:auto 1fr; gap:48px; align-items:center;\">\n        <div style=\"font-family:'Archivo',sans-serif; font-weight:900; font-size:clamp(48px,6vw,84px); color:#F2A900; letter-spacing:-0.02em; white-space:nowrap;\">11,383<\u002Fdiv>\n        <div>\n          <h3 style=\"font-family:'Archivo',sans-serif; font-weight:700; font-size:22px; margin:0 0 10px;\">Expansion candidate parcels<\u002Fh3>\n          <p style=\"font-size:16px; color:#C7C3BA; margin:0;\">Parcels with good soil that aren't currently under orchard or vineyard use — a real, data-grounded answer to \"where could this industry grow\". This reflects physical land suitability only, not investment readiness: it doesn't model irrigation access, licensing, or land-use change.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <!-- Apophenia correlation -->\n      <div style=\"display:grid; grid-template-columns:1fr 1fr; gap:64px; margin-bottom:88px; align-items:center;\">\n        <div>\n          <h3 style=\"font-family:'Archivo',sans-serif; font-weight:700; font-size:20px; margin:0 0 20px;\">Cross-project comparison with Apophenia<\u002Fh3>\n          <svg sc-camel-view-box=\"0 0 320 220\" style=\"width:100%; height:auto; max-width:400px;\">\n            <line x1=\"30\" y1=\"10\" x2=\"30\" y2=\"190\" stroke=\"#B0ADA3\" stroke-width=\"1\"><\u002Fline>\n            <line x1=\"30\" y1=\"190\" x2=\"300\" y2=\"190\" stroke=\"#B0ADA3\" stroke-width=\"1\"><\u002Fline>\n            <line x1=\"45\" y1=\"35\" x2=\"285\" y2=\"170\" stroke=\"#B98552\" stroke-width=\"2\" stroke-dasharray=\"5,5\"><\u002Fline>\n            <circle cx=\"55\" cy=\"40\" r=\"7\" fill=\"#915117\"><\u002Fcircle>\n            <circle cx=\"100\" cy=\"65\" r=\"7\" fill=\"#915117\"><\u002Fcircle>\n            <circle cx=\"160\" cy=\"95\" r=\"7\" fill=\"#915117\"><\u002Fcircle>\n            <circle cx=\"220\" cy=\"140\" r=\"7\" fill=\"#915117\"><\u002Fcircle>\n            <circle cx=\"270\" cy=\"160\" r=\"7\" fill=\"#915117\"><\u002Fcircle>\n            <text x=\"30\" y=\"208\" font-family=\"Source Sans 3\" font-size=\"11\" fill=\"#5C564A\">Soil suitability score →<\u002Ftext>\n            <text x=\"4\" y=\"20\" font-family=\"Source Sans 3\" font-size=\"11\" fill=\"#5C564A\" transform=\"rotate(-90 4 20)\">Psa incidence →<\u002Ftext>\n          <\u002Fsvg>\n          <p style=\"font-size:13.5px; color:#5C564A; margin-top:8px;\">Illustrative pattern, n = 5 subzones.<\u002Fp>\n        <\u002Fdiv>\n        <div>\n          <div style=\"font-family:'Archivo',sans-serif; font-weight:900; font-size:44px; color:#915117; margin-bottom:8px;\">r = −0.86<\u002Fdiv>\n          <p style=\"font-size:16px; color:#33302A; margin:0 0 20px;\">Soil suitability correlates with Apophenia's synthetic risk indicators, most strongly with Psa disease incidence.<\u002Fp>\n          <div style=\"background:#F2A900; padding:20px 22px; border-radius:2px;\">\n            <div style=\"font-family:'Archivo',sans-serif; font-weight:700; font-size:13px; text-transform:uppercase; letter-spacing:0.05em; color:#201C17; margin-bottom:8px;\">Read this carefully<\u002Fdiv>\n            <p style=\"font-size:15px; color:#201C17; margin:0;\">Apophenia's risk data is synthetic and illustrative, so this demonstrates cross-project analytical technique — not a validated real-world finding. With only five subzones, it's also far too small a sample for statistical confidence regardless.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <!-- Climate -->\n      <div>\n        <h3 style=\"font-family:'Archivo',sans-serif; font-weight:700; font-size:20px; margin:0 0 28px;\">Climate risk<\u002Fh3>\n        <div style=\"display:grid; grid-template-columns:1fr 1fr 1fr; gap:40px;\">\n          <div>\n            <div style=\"font-family:'Archivo',sans-serif; font-weight:800; font-size:15px; margin-bottom:14px;\">Frost risk<\u002Fdiv>\n            <div style=\"font-family:'Archivo',sans-serif; font-weight:900; font-size:36px; color:#915117;\">Negligible<\u002Fdiv>\n            <p style=\"font-size:14.5px; color:#4A443C; margin-top:8px;\">Across the whole region.<\u002Fp>\n          <\u002Fdiv>\n          <div>\n            <div style=\"font-family:'Archivo',sans-serif; font-weight:800; font-size:15px; margin-bottom:14px;\">Chill hours<\u002Fdiv>\n            <div style=\"display:flex; gap:10px; align-items:flex-end; height:70px;\">\n              <div style=\"width:36px; height:70%; background:#915117;\"><\u002Fdiv>\n              <div style=\"width:36px; height:48%; background:#B98552;\"><\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"display:flex; gap:16px; font-size:12.5px; color:#4A443C; margin-top:8px;\"><span>Inland<\u002Fspan><span>Coastal<\u002Fspan><\u002Fdiv>\n            <p style=\"font-size:14.5px; color:#4A443C; margin-top:8px;\">Meaningful coastal vs inland variation.<\u002Fp>\n          <\u002Fdiv>\n          <div>\n            <div style=\"font-family:'Archivo',sans-serif; font-weight:800; font-size:15px; margin-bottom:14px;\">Heavy-rainfall frequency<\u002Fdiv>\n            <div style=\"display:flex; flex-direction:column; gap:6px;\">\n              <div style=\"display:flex; align-items:center; gap:8px;\"><div style=\"width:100%; background:#8A8478; height:14px; border-radius:1px;\"><div style=\"width:100%; height:100%; background:#915117;\"><\u002Fdiv><\u002Fdiv><span style=\"font-size:12px; color:#4A443C; white-space:nowrap;\">Ōpōtiki<\u002Fspan><\u002Fdiv>\n              <div style=\"display:flex; align-items:center; gap:8px;\"><div style=\"width:100%; background:#8A8478; height:14px; border-radius:1px;\"><div style=\"width:78%; height:100%; background:#B98552;\"><\u002Fdiv><\u002Fdiv><span style=\"font-size:12px; color:#4A443C; white-space:nowrap;\">Whakatāne<\u002Fspan><\u002Fdiv>\n              <div style=\"display:flex; align-items:center; gap:8px;\"><div style=\"width:100%; background:#8A8478; height:14px; border-radius:1px;\"><div style=\"width:52%; height:100%; background:#B98552;\"><\u002Fdiv><\u002Fdiv><span style=\"font-size:12px; color:#4A443C; white-space:nowrap;\">W. BOP<\u002Fspan><\u002Fdiv>\n            <\u002Fdiv>\n            <p style=\"font-size:14.5px; color:#4A443C; margin-top:10px;\">Ōpōtiki sees the highest frequency of the five subzones.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- MAP -->\n  <div style=\"max-width:1240px; margin:0 auto; padding:96px 32px;\">\n    <div style=\"font-family:'Archivo',sans-serif; font-weight:700; font-size:15px; letter-spacing:0.08em; text-transform:uppercase; color:#78420F; margin-bottom:16px;\">Suitability map<\u002Fdiv>\n    <h2 style=\"font-family:'Archivo',sans-serif; font-weight:800; font-size:clamp(32px,3.4vw,44px); line-height:1.15; letter-spacing:-0.02em; margin:0 0 32px;\">Every scored parcel, mapped<\u002Fh2>\n    <div style=\"width:100%; height:560px;\">\n      <image-slot id=\"suitability-map\" shape=\"rect\" placeholder=\"Suitability Map screenshot — insert real dashboard capture here\"><\u002Fimage-slot>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- LIMITATIONS -->\n  <div id=\"limitations\" style=\"background:#DEDDD5; padding:96px 32px;\">\n    <div style=\"max-width:1240px; margin:0 auto;\">\n      <div style=\"font-family:'Archivo',sans-serif; font-weight:700; font-size:15px; letter-spacing:0.08em; text-transform:uppercase; color:#78420F; margin-bottom:16px;\">Limitations<\u002Fdiv>\n      <h2 style=\"font-family:'Archivo',sans-serif; font-weight:800; font-size:clamp(32px,3.4vw,44px); line-height:1.15; letter-spacing:-0.02em; margin:0 0 48px; max-width:700px;\">What this model doesn't cover<\u002Fh2>\n      <div style=\"display:grid; grid-template-columns:1fr 1fr; gap:28px 64px;\">\n        <div style=\"padding:24px 0; border-top:1.5px solid #201C17;\">\n          <h3 style=\"font-family:'Archivo',sans-serif; font-weight:700; font-size:17px; margin:0 0 8px;\">Flood risk<\u002Fh3>\n          <p style=\"font-size:15.5px; color:#4A443C; margin:0;\">DEM-based flood modelling is excluded in favour of soil drainage class — elevation alone isn't a reliable flood indicator without full hydrology.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"padding:24px 0; border-top:1.5px solid #201C17;\">\n          <h3 style=\"font-family:'Archivo',sans-serif; font-weight:700; font-size:17px; margin:0 0 8px;\">Water-holding capacity<\u002Fh3>\n          <p style=\"font-size:15.5px; color:#4A443C; margin:0;\">Approximated via soil texture and drainage, since the direct dataset isn't freely available.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"padding:24px 0; border-top:1.5px solid #201C17;\">\n          <h3 style=\"font-family:'Archivo',sans-serif; font-weight:700; font-size:17px; margin:0 0 8px;\">Wind exposure and disease risk<\u002Fh3>\n          <p style=\"font-size:15.5px; color:#4A443C; margin:0;\">Wind exposure and Psa disease risk aren't modelled in Terroir itself.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"padding:24px 0; border-top:1.5px solid #201C17;\">\n          <h3 style=\"font-family:'Archivo',sans-serif; font-weight:700; font-size:17px; margin:0 0 8px;\">Slope and machinery access<\u002Fh3>\n          <p style=\"font-size:15.5px; color:#4A443C; margin:0;\">Slope and machinery operability aren't modelled.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"padding:24px 0; border-top:1.5px solid #201C17; grid-column:span 2;\">\n          <h3 style=\"font-family:'Archivo',sans-serif; font-weight:700; font-size:17px; margin:0 0 8px;\">Irrigation access and varietal licensing<\u002Fh3>\n          <p style=\"font-size:15.5px; color:#4A443C; margin:0; max-width:640px;\">Irrigation access and Zespri varietal licensing aren't modelled — this is why \"expansion candidates\" reflects physical suitability, not investment readiness.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- FOOTER / CTA -->\n  <div style=\"padding:96px 32px 64px;\">\n    <div style=\"max-width:1240px; margin:0 auto;\">\n      <h2 style=\"font-family:'Archivo',sans-serif; font-weight:800; font-size:clamp(28px,3vw,38px); letter-spacing:-0.02em; margin:0 0 36px; text-wrap:pretty;\">Explore the dashboard, the code, or get in touch<\u002Fh2>\n      <div style=\"display:flex; flex-wrap:wrap; gap:14px; margin-bottom:64px;\">\n        <a href=\"#\" target=\"_blank\" rel=\"noopener\" style=\"font-family:'Archivo',sans-serif; font-weight:700; font-size:15px; background:#915117; color:#F4F1EA; padding:14px 26px; border-radius:2px; text-decoration:none;\">Live dashboard<\u002Fa>\n        <a href=\"#\" target=\"_blank\" rel=\"noopener\" style=\"font-family:'Archivo',sans-serif; font-weight:700; font-size:15px; background:transparent; color:#201C17; border:1.5px solid #201C17; padding:12.5px 26px; border-radius:2px; text-decoration:none;\">GitHub repo<\u002Fa>\n        <a href=\"https://apophenia-nz.vercel.app\" target=\"_blank\" rel=\"noopener\" style=\"font-family:'Archivo',sans-serif; font-weight:700; font-size:15px; background:transparent; color:#201C17; border:1.5px solid #201C17; padding:12.5px 26px; border-radius:2px; text-decoration:none;\">Apophenia<\u002Fa>\n        <a href=\"#\" target=\"_blank\" rel=\"noopener\" style=\"font-family:'Archivo',sans-serif; font-weight:700; font-size:15px; background:transparent; color:#201C17; border:1.5px solid #201C17; padding:12.5px 26px; border-radius:2px; text-decoration:none;\">LinkedIn<\u002Fa>\n      <\u002Fdiv>\n      <div style=\"display:flex; justify-content:space-between; align-items:center; border-top:1px solid #C9C6BD; padding-top:28px; font-size:14px; color:#5C564A;\">\n        <div style=\"display:flex; align-items:center; gap:10px;\">\n          <span style=\"display:inline-block; width:9px; height:9px; border-radius:50%; background:#0B4F3D;\"><\u002Fspan>\n          Terroir — part of Gabriela Olivera's data portfolio\n        <\u002Fdiv>\n        <div>Built on LINZ, S-map/LRIS, LCDB &amp; Open-Meteo data<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n<\u002Fdiv>\n\n<\u002Fx-dc>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
